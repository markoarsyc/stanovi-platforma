name: Stanovi Platforma CI/CD

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  # 1. JOB: Paralelna provera kvaliteta i formata koda (Linting)
  lint-code:
    runs-on: windows-latest
    steps:
      - name: Preuzimanje koda (Checkout)
        uses: actions/checkout@v5

      - name: Podešavanje Node.js okruženja
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            ./stanovi-backend/package-lock.json
            ./stanovi-frontend/package-lock.json

      - name: Provera Backend koda (Generisanje Prisma klijenta + ESLint)
        run: |
          cd stanovi-backend
          npm ci
          npx prisma generate
          npm run lint

      - name: Provera Frontend koda (ESLint)
        run: |
          cd stanovi-frontend
          npm ci
          npm run lint

  # 2. JOB: Paralelni build Frontend-a
  build-frontend:
    runs-on: windows-latest
    steps:
      - name: Preuzimanje koda (Checkout)
        uses: actions/checkout@v5

      - name: Podešavanje Node.js okruženja
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './stanovi-frontend/package-lock.json'

      - name: Instalacija zavisnosti za Frontend
        run: |
          cd stanovi-frontend
          npm ci

      - name: Build React aplikacije
        run: |
          cd stanovi-frontend
          npm run build

  # 3. JOB: Paralelni build Backend-a
  build-backend:
    runs-on: windows-latest
    steps:
      - name: Preuzimanje koda (Checkout)
        uses: actions/checkout@v5

      - name: Podešavanje Node.js okruženja
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './stanovi-backend/package-lock.json'

      - name: Instalacija zavisnosti za Backend
        run: |
          cd stanovi-backend
          npm ci

      - name: Generisanje Prisma klijenta
        run: |
          cd stanovi-backend
          npx prisma generate

      - name: Build NestJS aplikacije
        run: |
          cd stanovi-backend
          npm run build

  # 4. JOB: Sekvencijalna verifikacija
  verifikacija-sistema:
    runs-on: windows-latest
    needs: [lint-code, build-frontend, build-backend]
    steps:
      - name: Potvrda uspešnosti CI procesa
        run: |
          Write-Output "=== CI STATUS ==="
          Write-Output "1. Provera formata koda (Linting): USPESNA"
          Write-Output "2. Kompilacija Frontend-a: USPESNA"
          Write-Output "3. Kompilacija Backend-a: USPESNA"
          Write-Output "Zakljucak: Kod ispunjava sve standarde kvaliteta i spreman je za produkciju!"

  # 5. JOB: Build Docker slika i Deploy na Azure
  deploy-to-azure:
    runs-on: ubuntu-latest
    needs: verifikacija-sistema
    steps:
      - name: Preuzimanje koda (Checkout)
        uses: actions/checkout@v5

      - name: Login na Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build i Push Backend slike
      - name: Build i Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./stanovi-backend
          file: ./stanovi-backend/Dockerfile
          push: true
          tags: indigobelgrade/stanovi-api:latest

      # Build i Push Frontend slike
      - name: Build i Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./stanovi-frontend
          file: ./stanovi-frontend/Dockerfile
          push: true
          tags: indigobelgrade/stanovi-frontend:latest

      # Deploy na Azure Web App
      - name: Deploy na Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'indigobelgrade'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          configuration-file: ./docker-compose-prod.yaml