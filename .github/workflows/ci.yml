name: Stanovi Platforma CI

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  # 1. JOB: Paralelna provera kvaliteta i formata koda (Linting)
  lint-code:
    runs-on: windows-latest
    steps:
      - name: Preuzimanje koda (Checkout)
        uses: actions/checkout@v4

      # Korišćenje predefinisane akcije za Node
      - name: Podešavanje Node.js okruženja
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            ./stanovi-backend/package-lock.json
            ./stanovi-frontend/package-lock.json

      - name: Provera Backend koda (Generisanje Prisma klijenta + ESLint)
        run: |
          cd stanovi-backend
          npm ci
          npx prisma generate
          npm run lint
        continue-on-error: false

      - name: Provera Frontend koda (ESLint)
        run: |
          cd stanovi-frontend
          npm ci
          npm run lint
        continue-on-error: false 

  # 2. JOB: Paralelni build Frontend-a
  build-frontend:
    runs-on: windows-latest
    steps:
      - name: Preuzimanje koda (Checkout)
        uses: actions/checkout@v4

      - name: Podešavanje Node.js okruženja
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './stanovi-frontend/package-lock.json'

      - name: Instalacija zavisnosti za Frontend
        run: |
          cd stanovi-frontend
          npm ci

      - name: Build React aplikacije
        run: |
          cd stanovi-frontend
          npm run build

  # 3. JOB: Paralelni build Backend-a
  build-backend:
    runs-on: windows-latest
    steps:
      - name: Preuzimanje koda (Checkout)
        uses: actions/checkout@v4

      - name: Podešavanje Node.js okruženja
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './stanovi-backend/package-lock.json'

      - name: Instalacija zavisnosti za Backend
        run: |
          cd stanovi-backend
          npm ci

      - name: Generisanje Prisma klijenta
        run: |
          cd stanovi-backend
          npx prisma generate
        continue-on-error: false

      - name: Build NestJS aplikacije
        run: |
          cd stanovi-backend
          npm run build

  # 4. JOB: Sekvencijalna verifikacija
  verifikacija-sistema:
    runs-on: windows-latest
    needs: [lint-code, build-frontend, build-backend]
    steps:
      - name: Potvrda uspešnosti CI procesa
        run: |
          Write-Output "=== CI STATUS ==="
          Write-Output "1. Provera formata koda (Linting): USPESNA"
          Write-Output "2. Kompilacija Frontend-a: USPESNA"
          Write-Output "3. Kompilacija Backend-a: USPESNA"
          Write-Output "Zakljucak: Kod ispunjava sve standarde kvaliteta i spreman je za produkciju!"