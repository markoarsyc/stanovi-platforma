name: stanovi_platforma

services:
  postgres:
    image: postgres:16
    container_name: stanovi_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT_EXTERNAL}:${POSTGRES_PORT_INTERNAL}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stanovi-network

  api:
    build: 
      context: ./stanovi-backend
      dockerfile: Dockerfile
    container_name: stanovi_api
    restart: always
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      JWT_SECRET: "${JWT_SECRET}"
      PORT: "${PORT}"
      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET}"
      CLOUDINARY_UPLOAD_FOLDER: "${CLOUDINARY_UPLOAD_FOLDER}"
    volumes:
      - ./stanovi-backend/dist:/app/dist:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); const req = http.get('http://localhost:${PORT}/api', (res) => { process.exit(res.statusCode === 200 || res.statusCode === 404 ? 0 : 1); }); req.on('error', () => process.exit(1));\""]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - stanovi-network
    command: >
      sh -c "DATABASE_URL='${DATABASE_URL}' npx prisma migrate deploy && npx prisma db seed && node dist/src/main"

  frontend:
    build:
      context: ./stanovi-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:${API_PORT}/api"
    container_name: stanovi_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || wget --spider -q http://localhost:80/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - stanovi-network

volumes:
  postgres_data:
    driver: local

networks:
  stanovi-network:
    driver: bridge