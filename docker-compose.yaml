services:
  postgres:
    image: postgres:16
    container_name: stanovi_postgres
    restart: always
    environment:
      POSTGRES_DB: stanovi_db
      POSTGRES_USER: stanovi_user
      POSTGRES_PASSWORD: stanovi_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stanovi_user -d stanovi_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: stanovi_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: stanovi_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  kafdrop:
    image: obsidiandynamics/kafdrop
    container_name: stanovi_kafdrop
    restart: always
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy

  api:
    build: 
      context: ./stanovi-backend
      dockerfile: Dockerfile
    container_name: stanovi_api
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # Prioritet: environment direktno definisan ovde uvek "gazi" sve ostalo
    environment:
      DATABASE_URL: "postgresql://stanovi_user:stanovi_password@postgres:5432/stanovi_db?schema=public"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_CLIENT_ID: "stanovi-api"
      JWT_SECRET: "${JWT_SECRET:-supersecretkey}"
      PORT: "3000"
      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET}"
      CLOUDINARY_UPLOAD_FOLDER: "${CLOUDINARY_UPLOAD_FOLDER:-stanovi-platforma/buildings}"
    command: >
      sh -c "DATABASE_URL='postgresql://stanovi_user:stanovi_password@postgres:5432/stanovi_db?schema=public' npx prisma migrate deploy && node dist/src/main"
    
  kafka-consumer:
    build: ./kafka-consumer
    container_name: stanovi_consumer
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - ./kafka-consumer/.env
    environment:
      # Osiguraj da i consumer gađa pravi host za bazu
      DATABASE_URL: "postgresql://stanovi_user:stanovi_password@postgres:5432/stanovi_db?schema=public"
      KAFKA_BROKERS: "kafka:9092"

volumes:
  postgres_data: