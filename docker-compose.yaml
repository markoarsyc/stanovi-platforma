version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: stanovi_postgres
    restart: always
    environment:
      POSTGRES_DB: stanovi_db
      POSTGRES_USER: stanovi_user
      POSTGRES_PASSWORD: stanovi_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
